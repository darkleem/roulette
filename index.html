<script type="module" src="./src/index.ts"></script>
<script type="text/javascript">
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    dataLayer.push(arguments);
  }

  gtag('js', new Date());
  gtag('config', 'G-5899C1DJM0');

  function getNames() {
    const value = document.querySelector('#in_names').value.trim();
    return value.split(/[,\r\n]/g).map(v => v.trim()).filter(v => !!v);
  }

  function parseName(nameStr) {
    const weightRegex = /(\/\d+)/;
    const countRegex = /(\*\d+)/;
    const hasWeight = weightRegex.test(nameStr);
    const hasCount = countRegex.test(nameStr);
    const name = /^\s*([^\/*]+)?/.exec(nameStr)[1];
    const weight = hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', '')) : 1;
    const count = hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', '')) : 1;
    return {
      name,
      weight,
      count,
    };
  }

  function getReady() {
    const names = getNames();
    window.roulette.setMarbles(names);
    ready = names.length > 0;
    localStorage.setItem('mbr_names', names.join(','));
    applyWinnerSetting();
  }

  // 구슬 수가 바뀔 때마다 다시 호출된다. 범위 클리핑은 roulette이 하고, 잘린 결과를 input에 되돌려 쓴다.
  // edited는 사용자가 방금 고친 범위 input('start' | 'end')
  function applyWinnerSetting(edited) {
    const rankInput = document.querySelector('#in_winningRank');
    const startInput = document.querySelector('#in_rangeStart');
    const endInput = document.querySelector('#in_rangeEnd');

    let start;
    let end;
    switch (winnerType) {
      case 'first':
        start = end = 1;
        break;
      case 'last':
        start = end = window.roulette.getCount();
        break;
      case 'multi':
        start = parseInt(startInput.value, 10) || 1;
        end = parseInt(endInput.value, 10) || 1;
        // 뒤집힌 범위는 방금 고친 쪽을 존중하고 반대쪽을 따라오게 한다
        if (end < start) {
          if (edited === 'end') {
            start = end;
          } else {
            end = start;
          }
        }
        break;
      default:
        start = end = parseInt(rankInput.value, 10) || 1;
    }

    window.roulette.setWinnerRange(start - 1, end - 1);
    const clipped = window.roulette.getWinnerRange();
    // 범위 input은 여러명 모드일 때만 건드린다. 다른 모드가 덮어쓰면 사용자가 넣어둔 범위가 날아간다
    if (winnerType === 'multi') {
      startInput.value = clipped.start + 1;
      endInput.value = clipped.end + 1;
    } else {
      rankInput.value = clipped.start + 1;
    }

    document.querySelector('.btn-first-winner').classList.toggle('active', winnerType === 'first');
    document.querySelector('.btn-last-winner').classList.toggle('active', winnerType === 'last');
    document.querySelector('.btn-multi-winner').classList.toggle('active', winnerType === 'multi');
    rankInput.classList.toggle('active', winnerType === 'custom');
    document.querySelector('.row-range').classList.toggle('active', winnerType === 'multi');
  }

  function selectWinnerType(type, edited) {
    winnerType = type;
    applyWinnerSetting(edited);
  }


  let ready = false;
  let winnerType = 'first';

  document.addEventListener('DOMContentLoaded', () => {
    initialize();
  });

  function initialize() {
    if (!window.roulette || !window.roulette.isReady) {
      console.log('does not loaded yet');
      setTimeout(initialize, 100);
      return;
    }
    console.log('initializing start');

    const urlParams = new URLSearchParams(window.location.search);
    const namesFromUrl = urlParams.get('names');

    if (namesFromUrl) {
      document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
    } else {
      const savedNames = localStorage.getItem('mbr_names');
      if (savedNames) {
        document.querySelector('#in_names').value = savedNames;
      }
    }
    document.querySelector('#in_names').addEventListener('input', () => {
      getReady();
    });

    document.querySelector('#in_names').addEventListener('blur', () => {
      const nameSource = getNames();
      const nameSet = new Set();
      const nameCounts = {};
      nameSource.forEach(nameSrc => {
        const name = parseName(nameSrc);
        const key = name.weight > 1 ? `${name.name}/${name.weight}` : name.name;
        if (!nameSet.has(key)) {
          nameSet.add(key);
          nameCounts[key] = 0;
        }
        nameCounts[key] += name.count;
      });
      const result = [];
      Object.keys(nameCounts).forEach(key => {
        if (nameCounts[key] > 1) {
          result.push(`${key}*${nameCounts[key]}`);
        } else {
          result.push(key);
        }
      });

      const oldValue = document.querySelector('#in_names').value;
      const newValue = result.join(',');

      if (oldValue !== newValue) {
        document.querySelector('#in_names').value = newValue;
        getReady();
      }
    });

    document.querySelector('#btnShuffle').addEventListener('click', () => {
      getReady();
    });

    document.querySelector('#btnStart').addEventListener('click', () => {
      if (!ready) return;
      gtag && gtag('event', 'start', {
        'event_category': 'roulette',
        'event_label': 'start',
        'value': window.roulette.getCount(),
      });
      const names = getNames();
      const marbles = names.map(n => {
        const p = parseName(n);
        return { name: p.name, count: p.count };
      });
      if (typeof umami !== 'undefined') {
        const currentMap = window.roulette.getCurrentMap();
        umami.track('start', {
          count: window.roulette.getCount(),
          map: currentMap ? currentMap.title : 'unknown',
        });
        marbles.forEach(m => {
          umami.track('marble', { name: m.name, count: m.count });
        });
      }
      document.querySelector('#settings').classList.add('hide');
      window.roulette.start();
    });

    document.querySelector('#chkAutoRecording').addEventListener('change', (e) => {
      window.options.autoRecording = e.target.matches(':checked');
      window.roulette.setAutoRecording(window.options.autoRecording);
    });

    document.querySelector('#chkSkill').addEventListener('change', (e) => {
      window.options.useSkills = e.target.matches(':checked');
    });

    document.querySelector('#chkDarkMode').addEventListener('change', (e) => {
      window.options.darkMode = e.target.matches(':checked');
      window.roulette.setTheme(window.options.darkMode ? 'dark' : 'light');
      document.documentElement.classList.toggle('light', !window.options.darkMode);
    });

    document.querySelector('#in_winningRank').addEventListener('change', () => selectWinnerType('custom'));
    document.querySelector('.btn-last-winner').addEventListener('click', () => selectWinnerType('last'));
    document.querySelector('.btn-first-winner').addEventListener('click', () => selectWinnerType('first'));
    document.querySelector('.btn-multi-winner').addEventListener('click', () => selectWinnerType('multi'));
    document.querySelector('#in_rangeStart').addEventListener('change', () => selectWinnerType('multi', 'start'));
    document.querySelector('#in_rangeEnd').addEventListener('change', () => selectWinnerType('multi', 'end'));

    let currentRound = parseInt(sessionStorage.getItem('mbr_current_round') || '1', 10);
    let roundHistory = [];
    try {
      const savedHistory = sessionStorage.getItem('mbr_round_history');
      if (savedHistory) roundHistory = JSON.parse(savedHistory);
    } catch (e) {
      roundHistory = [];
    }

    function saveSessionHistory() {
      sessionStorage.setItem('mbr_current_round', currentRound.toString());
      sessionStorage.setItem('mbr_round_history', JSON.stringify(roundHistory));
    }

    function showWinnerModal(round, winners, history, isViewingHistory = false) {
      const modal = document.querySelector('#winnerModal');
      const title = document.querySelector('#winnerModalTitle');
      const body = document.querySelector('#winnerModalBody');
      const btnExclude = document.querySelector('#btnExcludeWinners');
      const btnRerun = document.querySelector('#btnRerunSame');

      if (isViewingHistory) {
        title.textContent = `🏆 역대 회차 당첨 기록 (총 ${history.length}회차)`;
        btnExclude.style.display = 'none';
        btnRerun.style.display = 'none';
      } else {
        title.textContent = `🎉 ${round}차 당첨 결과`;
        btnExclude.style.display = 'inline-block';
        btnRerun.style.display = 'inline-block';
      }

      let winnersHtml = '';
      if (!isViewingHistory) {
        winnersHtml += `
          <div class="round-winner-section">
            <h3>이번 ${round}차 당첨자 (${winners.length}명)</h3>
            <div class="winner-cards">
        `;

        winners.forEach((name, idx) => {
          const img = window.roulette ? window.roulette.getMarbleImage(name) : null;
          let avatarHtml = '';
          if (img && img.src) {
            avatarHtml = `<img src="${img.src}" class="winner-avatar" alt="${name}" />`;
          } else {
            avatarHtml = `<span class="winner-avatar" style="background:#58c9af; display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:#000;">★</span>`;
          }
          winnersHtml += `
            <div class="winner-card">
              ${avatarHtml}
              <span class="winner-rank">#${idx + 1}</span>
              <span class="winner-name">${name}</span>
            </div>
          `;
        });
        winnersHtml += `</div></div>`;
      }

      if (history.length > 0) {
        winnersHtml += `
          <div class="history-section" style="${isViewingHistory ? 'margin-top: 0;' : ''}">
            <h4>📜 ${isViewingHistory ? '회차별 당첨 목록' : '역대 회차 당첨 히스토리'}</h4>
        `;
        history.forEach((h) => {
          winnersHtml += `
            <div class="history-item">
              <span class="history-round">${h.round}차:</span>
              <div style="display:inline-flex; gap:4px; flex-wrap:wrap;">
                ${h.winners.map(w => `<span class="history-winner-tag">${w}</span>`).join('')}
              </div>
            </div>
          `;
        });
        winnersHtml += `</div>`;
      }

      body.innerHTML = winnersHtml;
      modal.classList.add('show');
    }

    function closeWinnerModal() {
      document.querySelector('#winnerModal').classList.remove('show');
      document.querySelector('#settings').classList.remove('hide');
    }

    function excludeWinnersAndRerun() {
      const lastResult = roundHistory[roundHistory.length - 1];
      if (!lastResult || !lastResult.winners || lastResult.winners.length === 0) {
        rerunSame();
        return;
      }

      const toExclude = [...lastResult.winners];
      const rawVal = document.querySelector('#in_names').value;
      const tokens = rawVal.split(/[,\r\n]/g).map(v => v.trim()).filter(Boolean);
      const newItems = [];

      tokens.forEach((token) => {
        const parsed = parseName(token);
        let count = parsed.count;
        for (let i = toExclude.length - 1; i >= 0; i--) {
          if (toExclude[i] === parsed.name && count > 0) {
            count--;
            toExclude.splice(i, 1);
          }
        }
        if (count > 0) {
          const weightPart = parsed.weight > 1 ? `/${parsed.weight}` : '';
          const countPart = count > 1 ? `*${count}` : '';
          newItems.push(`${parsed.name}${weightPart}${countPart}`);
        }
      });

      const newStr = newItems.join(',');
      document.querySelector('#in_names').value = newStr;
      localStorage.setItem('mbr_names', newStr);

      getReady();

      if (window.roulette.getCount() === 0) {
        document.querySelector('#winnerModal').classList.remove('show');
        document.querySelector('#settings').classList.remove('hide');
        simpleToast('남은 인원이 없습니다.');
        return;
      }

      currentRound++;
      saveSessionHistory();
      document.querySelector('#winnerModal').classList.remove('show');
      document.querySelector('#settings').classList.add('hide');
      window.roulette.start();
    }

    function rerunSame() {
      getReady();
      if (window.roulette.getCount() === 0) {
        document.querySelector('#winnerModal').classList.remove('show');
        document.querySelector('#settings').classList.remove('hide');
        simpleToast('남은 인원이 없습니다.');
        return;
      }
      currentRound++;
      saveSessionHistory();
      document.querySelector('#winnerModal').classList.remove('show');
      document.querySelector('#settings').classList.add('hide');
      window.roulette.start();
    }

    document.querySelector('#btnCloseWinnerX').addEventListener('click', closeWinnerModal);
    document.querySelector('#btnCloseWinnerModal').addEventListener('click', closeWinnerModal);
    document.querySelector('#btnExcludeWinners').addEventListener('click', excludeWinnersAndRerun);
    document.querySelector('#btnRerunSame').addEventListener('click', rerunSame);
    document.querySelector('#btnHistory').addEventListener('click', () => {
      if (roundHistory.length === 0) {
        simpleToast('아직 진행된 회차 결과가 없습니다.');
        return;
      }
      showWinnerModal(currentRound, [], roundHistory, true);
    });
    document.querySelector('#btnClearHistory').addEventListener('click', () => {
      if (confirm('모든 회차 당첨 기록을 초기화하시겠습니까?')) {
        roundHistory = [];
        currentRound = 1;
        saveSessionHistory();
        closeWinnerModal();
        simpleToast('당첨 기록이 초기화되었습니다.');
      }
    });

    const PRESET_NAMES = ['기본', '챔루', '쿠빈', '꽉변', '주누피', '왈도쿤'];

    function openImageCustomModal() {
      if (!window.roulette) return;
      const marbles = window.roulette.getMarbles();
      if (marbles.length === 0) {
        getReady();
      }
      const currentMarbles = window.roulette.getMarbles();
      const listEl = document.querySelector('#imageCustomList');

      if (currentMarbles.length === 0) {
        listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">참여 중인 구슬이 없습니다. 이름을 먼저 입력해주세요.</div>';
        document.querySelector('#imageCustomModal').classList.add('show');
        return;
      }

      const presetsObj = window.roulette ? window.roulette.getPresetImages() : {};
      const presetNames = Object.keys(presetsObj);

      let html = '';
      currentMarbles.forEach((m, idx) => {
        const customSkin = window.roulette.getCustomSkin(idx);
        const defaultImg = window.roulette.getMarbleImage(m.name);
        const activeImg = customSkin || defaultImg;

        let previewSrc = '';
        if (activeImg && activeImg.src) {
          previewSrc = activeImg.src;
        }

        let optionsHtml = '<option value="default">기본</option>';
        presetNames.forEach((pName) => {
          optionsHtml += `<option value="${pName}">${pName}</option>`;
        });

        html += `
          <div class="image-custom-item" data-index="${idx}" data-name="${m.name}">
            <div class="marble-info">
              <span class="marble-avatar-preview" id="preview-${idx}" style="background: ${previewSrc ? `url('${previewSrc}') center/cover` : `hsl(${m.hue} 100% 50%)`};"></span>
              <span class="marble-name-tag">#${idx + 1} ${m.name}</span>
            </div>
            <div class="marble-controls">
              <select class="slt-preset" data-index="${idx}">
                ${optionsHtml}
              </select>
              <label class="btn-upload-file">
                사진 선택
                <input type="file" accept="image/*" class="file-upload-input" data-index="${idx}" style="display: none;" />
              </label>
              <button class="btn-apply-same" data-index="${idx}" data-name="${m.name}" title="같은 이름을 가진 모든 구슬에 이 이미지 적용">동명 일괄 적용</button>
            </div>
          </div>
        `;
      });

      listEl.innerHTML = html;

      listEl.querySelectorAll('.slt-preset').forEach((slt) => {
        const idx = parseInt(slt.dataset.index, 10);
        const marble = currentMarbles[idx];
        if (presetNames.includes(marble.name)) {
          slt.value = marble.name;
        }
        slt.addEventListener('change', (e) => {
          const val = e.target.value;
          const preview = document.querySelector(`#preview-${idx}`);
          if (val === 'default') {
            window.roulette.setCustomSkin(idx, undefined);
            preview.style.background = `hsl(${marble.hue} 100% 50%)`;
          } else {
            const presets = window.roulette.getPresetImages();
            const img = presets[val] || window.roulette.getMarbleImage(val);
            if (img) {
              window.roulette.setCustomSkin(idx, img);
              preview.style.background = `url('${img.src}') center/cover`;
            }
          }
        });
      });

      listEl.querySelectorAll('.file-upload-input').forEach((inp) => {
        const idx = parseInt(inp.dataset.index, 10);
        inp.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (rev) => {
            const img = new Image();
            img.onload = () => {
              window.roulette.setCustomSkin(idx, img);
              const preview = document.querySelector(`#preview-${idx}`);
              preview.style.background = `url('${img.src}') center/cover`;
            };
            img.src = rev.target.result;
          };
          reader.readAsDataURL(file);
        });
      });

      listEl.querySelectorAll('.btn-apply-same').forEach((btn) => {
        const idx = parseInt(btn.dataset.index, 10);
        const name = btn.dataset.name;
        btn.addEventListener('click', () => {
          const currentSkin = window.roulette.getCustomSkin(idx) || window.roulette.getMarbleImage(name);
          window.roulette.setCustomSkinByName(name, currentSkin);
          simpleToast(`'${name}' 이름을 가진 모든 구슬에 적용되었습니다.`);
          openImageCustomModal();
        });
      });

      document.querySelector('#imageCustomModal').classList.add('show');
    }

    function closeImageCustomModal() {
      document.querySelector('#imageCustomModal').classList.remove('show');
    }

    document.querySelector('#btnCustomImage').addEventListener('click', openImageCustomModal);
    document.querySelector('#btnCloseImageCustomX').addEventListener('click', closeImageCustomModal);
    document.querySelector('#btnApplyCustomImages').addEventListener('click', closeImageCustomModal);
    document.querySelector('#btnResetAllImages').addEventListener('click', () => {
      window.roulette.clearCustomSkins();
      getReady();
      openImageCustomModal();
      simpleToast('모든 이미지가 초기화되었습니다.');
    });

    window.roulette.addEventListener('goal', (e) => {
      ready = false;
      const detail = e.detail || {};
      const winners = detail.winners || (detail.winner ? [detail.winner] : []);
      roundHistory.push({ round: currentRound, winners });
      saveSessionHistory();
      setTimeout(() => {
        showWinnerModal(currentRound, winners, roundHistory);
      }, 1000);
    });

    window.roulette.addEventListener('message', (e) => {
      simpleToast(e.detail);
    });

    const toggleBtn = document.querySelector('#btnToggleSettings');
    const collapsible = document.querySelector('.collapsible-rows');
    toggleBtn.addEventListener('click', () => {
      collapsible.classList.toggle('collapsed');
      toggleBtn.querySelector('.toggle-arrow').textContent =
        collapsible.classList.contains('collapsed') ? '▲' : '▼';
    });

    document.querySelector('#btnShuffle').click();

    const maps = window.roulette.getMaps();
    const mapSelector = document.querySelector('#sltMap');
    maps.forEach((map) => {
      const option = document.createElement('option');
      option.value = map.index;
      option.innerHTML = map.title;
      option.setAttribute('data-trans', '');
      window.translateElement(option);
      mapSelector.append(option);
    });
    mapSelector.addEventListener('change', (e) => {
      window.roulette.setMap(e.target.value);
      // setMap은 살아남은 구슬에서 이름을 뽑아 재구성한다. 골인한 구슬이 사라지고
      // 무게(/n)도 날아가므로, 원본인 이름 입력창에서 다시 채운다
      getReady();
    });

    // const checkDonateButtonLoaded = () => {
    //   const btn = document.querySelector('span.bmc-btn-text');
    //   if (!btn) {
    //     setTimeout(checkDonateButtonLoaded, 100);
    //   } else {
    //     console.log('donation button has been loaded');
    //     btn.setAttribute('data-trans', '');
    //     window.translateElement(btn);
    //   }
    // };
    // setTimeout(checkDonateButtonLoaded, 100);

    const currentNotice = 7;
    const noticeKey = 'lastViewedNotification';

    const closeNotice = () => {
      document.querySelector('#notice').style.display = 'none';
      localStorage.setItem(noticeKey, currentNotice.toString());
    };

    const openNotice = () => {
      console.log('openNotice');
      document.querySelector('#notice').style.display = 'flex';
    };

    document.querySelector('#closeNotice').addEventListener('click', () => {
      closeNotice();
    });

    document.querySelector('#btnNotice').addEventListener('click', () => {
      openNotice();
    });

    function simpleToast(msg) {
      const toast = document.createElement('div');
      toast.classList.add('toast');
      toast.innerHTML = msg;

      if (window.translateElement) {
        console.log('try to translate');
        window.translateElement(toast);
      }

      document.body.appendChild(toast);
      setTimeout(() => {
        document.body.removeChild(toast);
      }, 1200);
    }

    const checkNotice = () => {
      const lastViewed = localStorage.getItem(noticeKey);
      console.log('lastViewed', lastViewed);
      if (lastViewed === null || Number(lastViewed) < currentNotice) {
        openNotice();
      }
    };

    checkNotice();
  }
</script>
